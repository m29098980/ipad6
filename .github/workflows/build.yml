name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 打印工具链版本
        run: |
          xcodebuild -version
          xcode-select -p

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 下载 KWS 唤醒模型（中文 zipformer 3.3M int8）
        run: |
          set -euo pipefail
          mkdir -p Model
          curl -sSL --retry 3 -o /tmp/kws.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01.tar.bz2
          mkdir -p /tmp/kws && tar xjf /tmp/kws.tar.bz2 -C /tmp/kws
          D=/tmp/kws/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01
          cp "$D/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx" Model/encoder.onnx 2>/dev/null \
            || cp "$D/encoder-epoch-12-avg-2-chunk-16-left-64.onnx" Model/encoder.onnx
          cp "$D/decoder-epoch-12-avg-2-chunk-16-left-64.onnx" Model/decoder.onnx 2>/dev/null \
            || cp "$D/decoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx" Model/decoder.onnx
          cp "$D/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx" Model/joiner.onnx 2>/dev/null \
            || cp "$D/joiner-epoch-12-avg-2-chunk-16-left-64.onnx" Model/joiner.onnx
          cp "$D/tokens.txt" Model/tokens.txt
          cp keywords.txt Model/keywords.txt
          ls -lh Model/

      - name: 下载 ASR 转写模型（streaming zipformer small bilingual zh-en，int8）
        run: |
          set -euo pipefail
          mkdir -p Model/Asr
          curl -sSL --retry 3 -o /tmp/asr.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-small-bilingual-zh-en-2023-02-16.tar.bz2
          mkdir -p /tmp/asr && tar xjf /tmp/asr.tar.bz2 -C /tmp/asr
          D=/tmp/asr/sherpa-onnx-streaming-zipformer-small-bilingual-zh-en-2023-02-16
          ls "$D" | head -20
          cp $(ls "$D"/encoder*int8*.onnx | head -1) Model/Asr/encoder.onnx
          cp $(ls "$D"/decoder-*.onnx | grep -v int8 | head -1) Model/Asr/decoder.onnx
          cp $(ls "$D"/joiner-*.onnx | grep -v int8 | head -1) Model/Asr/joiner.onnx
          cp "$D/tokens.txt" Model/Asr/tokens.txt
          ls -lh Model/Asr/

      - name: 生成 Xcode 工程
        run: xcodegen generate --spec project.yml

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project MicProbe.xcodeproj \
            -scheme MicProbe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MicProbe.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee /tmp/build.log || {
              grep -E "error:" /tmp/build.log | sort -u | head -50 > /tmp/errors.txt
              mkdir -p /tmp/lr && cd /tmp/lr && git init -q
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              cp /tmp/errors.txt build-errors.txt
              git add . && git commit -qm "errors ${GITHUB_SHA::7}"
              git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/logs
              echo "编译错误已推送到 logs 分支"
              exit 1
            }

      - name: 打包成 ipa
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MicProbe.xcarchive/Products/Applications/MicProbe.app"
          test -d "$APP" || { echo "找不到 .app，编译失败"; exit 1; }
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry MicProbe.ipa Payload
          ls -lh MicProbe.ipa
          echo "IPA_PATH=$RUNNER_TEMP/ipa/MicProbe.ipa" >> "$GITHUB_ENV"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MicProbe-ipa
          path: ${{ runner.temp }}/ipa/MicProbe.ipa
          retention-days: 30

      - name: 推送 ipa 到 ipa 分支（供 SSH 拉取）
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf ipa-repo
          git init -q ipa-repo
          cd ipa-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$RUNNER_TEMP/ipa/MicProbe.ipa" .
          git add MicProbe.ipa
          git commit -qm "ipa build ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git push -qf origin HEAD:refs/heads/ipa
          echo "ipa 已推送到 ipa 分支"
