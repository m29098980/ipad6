name: build-wda

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/wda.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 克隆 WebDriverAgent
        run: git clone --depth 1 https://github.com/appium/WebDriverAgent.git

      - name: 编译（不签名）
        run: |
          set -o pipefail
          cd WebDriverAgent
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/wda-dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/wda.log || {
              tail -150 /tmp/wda.log > /tmp/werr.txt
              mkdir -p /tmp/wlr && cd /tmp/wlr && git init -q
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              cp /tmp/werr.txt wda-errors.txt
              git add . && git commit -qm "wda errors ${GITHUB_SHA::7}"
              git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/logs
              exit 1
            }
          find "$RUNNER_TEMP/wda-dd/Build/Products" -maxdepth 2 -name "*.app" || true

      - name: 打包 ipa
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/wda-dd/Build/Products" -maxdepth 3 -name "*.app" -type d | head -1 || true)
          if [ -z "$APP" ]; then
            find "$RUNNER_TEMP/wda-dd" -maxdepth 5 > /tmp/werr.txt || true
            mkdir -p /tmp/wlr && cd /tmp/wlr && git init -q
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            cp /tmp/werr.txt wda-errors.txt
            git add . && git commit -qm "wda pkg errors ${GITHUB_SHA::7}"
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/logs
            echo "找不到打包产物"; exit 1
          fi
          echo "APP=$APP"
          rm -rf "$RUNNER_TEMP/wpa"
          mkdir -p "$RUNNER_TEMP/wpa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/wpa/Payload/"
          cd "$RUNNER_TEMP/wpa"
          zip -qry wda.ipa Payload
          ls -lh wda.ipa

      - name: 推送 wda.ipa 到 ipa 分支
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf wda-repo && git init -q wda-repo && cd wda-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$RUNNER_TEMP/wpa/wda.ipa" .
          git add wda.ipa
          git commit -qm "wda build"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git push -qf origin HEAD:refs/heads/wda
          echo "wda.ipa 已推送到 ipa 分支"
